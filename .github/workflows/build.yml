name: Build Firmware

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'platformio.ini'
      - 'partitions_ota.csv'
      - 'partitions_8mb.csv'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'platformio.ini'
      - 'partitions_ota.csv'
      - 'partitions_8mb.csv'
      - '.github/workflows/build.yml'
  release:
    types: [created]

# Needed for softprops/action-gh-release to attach assets to the release.
permissions:
  contents: write

jobs:
  build:
    # Pinned like the PlatformIO platform: ubuntu-latest moves to a new image
    # underneath us (Ubuntu 26 from Oct 2026).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build ESP32-S3 firmware
        run: pio run -e esp32s3

      # Classic ESP32-WROOM (esp32dev, #154). Built on every push/PR/release so
      # the second target can't silently regress. NOT attached to releases yet —
      # it compiles + fits 4 MB, but is pending on-hardware validation, so it's
      # only offered as a CI artifact for testers (below), not as a release asset.
      - name: Build ESP32-WROOM (esp32dev) firmware
        run: pio run -e esp32dev

      # W5500 wired-Ethernet build (esp32s3-eth, #59 / #62). Compile-only guard so
      # the Ethernet target can't silently regress the way #62 did: that was a
      # shared-code change that built fine but broke MQTT / OTA on the eth build,
      # which CI never compiled. Not attached to releases (flashed per board with
      # the right SPI pins), just kept compiling on every push/PR.
      - name: Build W5500 Ethernet (esp32s3-eth) firmware
        run: pio run -e esp32s3-eth

      - name: Upload ESP32-WROOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32dev
          path: |
            .pio/build/esp32dev/firmware.bin
            .pio/build/esp32dev/firmware.elf
            .pio/build/esp32dev/bootloader.bin
            .pio/build/esp32dev/partitions.bin

      - name: Compute SHA256
        run: |
          cd .pio/build/esp32s3
          sha256sum firmware.bin bootloader.bin partitions.bin > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3
          path: |
            .pio/build/esp32s3/firmware.bin
            .pio/build/esp32s3/firmware.elf
            .pio/build/esp32s3/bootloader.bin
            .pio/build/esp32s3/partitions.bin
            .pio/build/esp32s3/SHA256SUMS.txt

      - name: Generate ESP Web Tools manifest
        if: github.event_name == 'release'
        run: |
          # The README one-click installer points its esp-web-install-button
          # at releases/latest/download/install.json. ESP Web Tools resolves
          # the part paths relative to the manifest, so they match the .bin
          # asset names attached below. Version comes from the release tag.
          cat > .pio/build/esp32s3/install.json <<EOF
          {
            "name": "Wallbox Gateway",
            "version": "${GITHUB_REF_NAME#v}",
            "funding_url": "https://github.com/botts7/esp32-wallbox",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "bootloader.bin", "offset": 0 },
                  { "path": "partitions.bin", "offset": 32768 },
                  { "path": "firmware.bin", "offset": 65536 }
                ]
              }
            ]
          }
          EOF
          cat .pio/build/esp32s3/install.json

      - name: Name firmware asset for integration OTA
        if: github.event_name == 'release'
        run: |
          # The HA integration's OTA picks the release asset whose name ends
          # '-<board>.bin' (custom_components/.../update.py pick_asset). Provide a
          # board-named copy of the app firmware alongside the generic
          # ESP-Web-Tools parts (firmware/bootloader/partitions + install.json).
          cp .pio/build/esp32s3/firmware.bin \
             ".pio/build/esp32s3/wallbox-gateway-${GITHUB_REF_NAME}-esp32s3.bin"
          # Board+tag-named ELF alongside the .bin. A coredump is just
          # addresses; turning /api/coredump/summary's backtrace into function
          # names + lines needs the EXACT ELF that built the running image.
          # Attaching it per release means any user's crash (or ours, #168) can
          # be symbolised from the release page — no rebuild, no guessing which
          # commit. Debug artifact only; never flashed.
          cp .pio/build/esp32s3/firmware.elf \
             ".pio/build/esp32s3/wallbox-gateway-${GITHUB_REF_NAME}-esp32s3.elf"
          # Classic ESP32-WROOM (esp32dev, #154): a board-named .bin so WROOM
          # gateways (board="esp32dev") can OTA from HA too — pick_asset needs a
          # '-esp32dev.bin' or it fails with "no firmware asset for board".
          cp .pio/build/esp32dev/firmware.bin \
             ".pio/build/esp32dev/wallbox-gateway-${GITHUB_REF_NAME}-esp32dev.bin"
          cp .pio/build/esp32dev/firmware.elf \
             ".pio/build/esp32dev/wallbox-gateway-${GITHUB_REF_NAME}-esp32dev.elf"

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .pio/build/esp32s3/wallbox-gateway-*-esp32s3.bin
            .pio/build/esp32s3/wallbox-gateway-*-esp32s3.elf
            .pio/build/esp32s3/firmware.bin
            .pio/build/esp32s3/bootloader.bin
            .pio/build/esp32s3/partitions.bin
            .pio/build/esp32s3/SHA256SUMS.txt
            .pio/build/esp32s3/install.json
            .pio/build/esp32dev/wallbox-gateway-*-esp32dev.bin
            .pio/build/esp32dev/wallbox-gateway-*-esp32dev.elf
