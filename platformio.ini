; Shared config for every build target. Board-specific bits (the board id and
; the S3-only USB-CDC flag) live in the per-env sections below.
[common]
; Pinned: espressif32 8.x pulls arduino-esp32 3.x (ESP-IDF 5), which changes
; APIs this firmware uses (esp_task_wdt_init, NimBLE, AsyncTCP). 7.0.1 is the
; release that ships arduino-esp32 2.0.17, the core every build is tested on.
; Unpinned, CI silently picked up 8.0.0 and every build broke.
platform = espressif32@7.0.1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions_ota.csv
extra_scripts =
    pre:scripts/version.py
    pre:scripts/precompress_settings.py
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.3.0
    ; 3.0 task #78 — ESPAsyncWebServer + its AsyncTCP dependency.
    ; PINNED to a known-good tag (NOT a caret wildcard) because
    ; this library has had breaking changes between minor releases.
    ; ESPAsyncWebServer also provides AsyncWebSocket which replaces
    ; the previously-pinned links2004/WebSockets (task #82 migration).
    ; 3.6.0 -> 3.12.1 (30 Oct 2026): 3.6.0 double-frees the TCP client
    ; when a /ws client disconnects and leaves the WS client list
    ; unlocked; reproduced as an async_tcp panic in seconds by
    ; connecting/dropping /ws clients. 3.12.1 releases the client from
    ; the request and locks the list. AsyncTCP pinned alongside it.
    ESP32Async/ESPAsyncWebServer@3.12.1
    ESP32Async/AsyncTCP@3.5.0
lib_ldf_mode = deep
build_flags =
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL=1
    -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL=0
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER=1
    -D CONFIG_BT_NIMBLE_ROLE_BROADCASTER=0
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    ; 3.0 task #78 — async webserver migration build flag.
    ; Default 1 = production: async on :80 (sync retired in STA per
    ; commit 6bf557b — when WB_ASYNC_WEB=0, STA mode has NO HTTP
    ; server at all because the async server's .cpp is compiled out
    ; behind #if WB_ASYNC_WEB and the sync server's beginSTA() no
    ; longer binds a listener. Set to 0 only for sync-only legacy
    ; testing builds. Both paths build clean.
    -D WB_ASYNC_WEB=1

; ESP32-S3-DevKitC-1 (the reference/primary board). USB-CDC serial on boot.
; 8 MB flash -> the larger partition table (3 MB OTA app slots vs the WROOM's
; 1.875 MB) for app-growth headroom. WROOM stays on the 4 MB partitions_ota.csv.
[env:esp32s3]
extends = common
board = esp32-s3-devkitc-1
board_build.partitions = partitions_8mb.csv
build_flags =
    ${common.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Classic ESP32-WROOM-32 (esp32dev) — the common/cheaper module (#154). 4 MB
; flash fits partitions_ota.csv exactly. No USB-CDC (serial is UART0), so the
; ARDUINO_USB_CDC_ON_BOOT flag is omitted. chip_temp has no usable die sensor
; on classic ESP32 and is already gated off (wb_web.h) — the Gateway
; Temperature entity just reads unavailable.
[env:esp32dev]
extends = common
board = esp32dev

; ESP32-S3 + WIZnet W5500 SPI Ethernet (community #eth, _Mike). Same firmware as
; esp32s3 but brings up wired Ethernet instead of WiFi (frees the 2.4 GHz radio
; for BLE — the usual cure for flaky-WiFi gateways). Pins match the Waveshare
; ESP32-S3-ETH base board and the ESP32-S3-POE-ETH (both hardware-validated,
; #59 / #62). SPI host 1 = SPI2_HOST.
; Releases ship this env as an HA OTA asset (wallbox-gateway-<ver>-esp32s3-eth.bin,
; #65). For a board wired DIFFERENTLY (e.g. 8DI-8RO, custom wiring) do NOT edit the
; pins below: add a new env with its own name and pin map, e.g.
;   [env:esp32s3-eth-8di8ro]
;   extends = env:esp32s3-eth
;   build_flags = ${env:esp32s3.build_flags} + the WB_ETH_* flags with its pins
; The env name becomes /api/status.board, so a new env makes HA OTA fail safe
; ("no firmware asset") instead of offering the stock-pin image, which would
; never bring the W5500 up and strand a wired-only gateway until a USB reflash.
[env:esp32s3-eth]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -D WB_ETH_W5500=1
    -D WB_ETH_SPI_HOST=1
    -D WB_ETH_SPI_MHZ=20
    ; Waveshare ESP32-S3-ETH base board (verified: tester's board, ASIN
    ; B0DKJ5VXC9). Confirmed against a tested esp_eth example's Kconfig defaults.
    -D WB_ETH_PIN_SCLK=13
    -D WB_ETH_PIN_MOSI=11
    -D WB_ETH_PIN_MISO=12
    -D WB_ETH_PIN_CS=14
    -D WB_ETH_PIN_INT=10
    -D WB_ETH_PIN_RST=9

; For OTA: pio run -e ota -t upload --upload-port <IP> [--upload-flags="--auth=<password>"]
; The OTA password is shown in the serial log on boot.
; If you've set a web auth password, use that. Otherwise it's "wb-XXXXXX" (last 6 hex of MAC).
[env:ota]
extends = env:esp32s3
upload_protocol = espota
upload_port = wallbox-gw.local
